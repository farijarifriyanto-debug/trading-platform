services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TRADING_DATA_DIR: /data
      TRADING_AUDIT_PATH: /data/paper-audit.jsonl
      TRADING_REQUIRE_AUTH: "${TRADING_REQUIRE_AUTH:-0}"
      TRADING_API_KEY: "${TRADING_API_KEY:-}"
      TRADING_MAX_BODY_BYTES: "${TRADING_MAX_BODY_BYTES:-2097152}"
      TRADING_MUTATION_RATE_PER_MINUTE: "${TRADING_MUTATION_RATE_PER_MINUTE:-120}"
    volumes:
      - trading-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  trading-data:
