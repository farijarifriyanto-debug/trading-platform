[project]
name = "trading-platform"
version = "0.6.0"
description = "Modular algorithmic trading platform with paper-first execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
crypto = ["ccxt>=4.4,<5"]
research = ["vectorbt>=0.28,<1", "plotly>=5,<6"]
ai = ["scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
